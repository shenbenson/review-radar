name: ReviewRadar
options:
  bundleIdPrefix: com.reviewradar
  deploymentTarget:
    macOS: "15.0"
  minimumXcodeGenVersion: "2.38"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  ReviewRadar:
    type: application
    platform: macOS
    sources:
      - path: Sources
    info:
      path: Info.plist
      properties:
        LSUIElement: true
        CFBundleName: ReviewRadar
        CFBundleDisplayName: ReviewRadar
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "3"
        CFBundleIconFile: AppIcon
        CFBundleIconName: AppIcon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.reviewradar.app
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    postbuildScripts:
      - name: Embed AppIcon.icns
        script: |
          # Ensure Notification Center / Finder get a complete multi-res icns
          # (asset catalog compile can drop sizes if slots mis-resolve).
          SRC="${SRCROOT}/Sources/Resources/AppIcon.icns"
          DST="${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/AppIcon.icns"
          if [ -f "$SRC" ]; then
            cp -f "$SRC" "$DST"
          fi

